<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Ricriju — Prenotazioni</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="apple-touch-icon" href="logo.jpeg">
<link rel="icon" href="logo.jpeg">
<style>
  :root {
    --bg: #f9f7f4;
    --card: #ffffff;
    --border: #e8e4df;
    --text: #1a1a1a;
    --muted: #7a7570;
    --accent: #c8a96e;
    --accent-dark: #a8864e;
    --green-bg: #edf7ed;
    --green-text: #2d6a2d;
    --green-border: #a3d4a3;
    --blue-bg: #e8f0fb;
    --blue-text: #1a3f7a;
    --blue-border: #90b0e8;
    --red: #d94040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center;
  }
  .login-logo { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .login-title { font-size: 22px; font-weight: 600; margin-bottom: 0.25rem; }
  .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 2rem; }
  .login-card input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; margin-bottom: 12px; background: var(--bg);
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* APP */
  #app { display: none; max-width: 680px; margin: 0 auto; padding: 1rem; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-top: 0.5rem; }
  .header-title { font-size: 22px; font-weight: 700; }
  .header-date { font-size: 13px; color: var(--muted); }
  .logout-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .logout-btn:hover { border-color: var(--muted); }

  /* TABS */
  .tabs { display: flex; gap: 4px; background: var(--border); border-radius: 12px; padding: 4px; margin-bottom: 1.5rem; }
  .tab { flex: 1; padding: 9px; border: none; background: none; border-radius: 9px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  /* BADGE CLIENTE */
  .client-badge { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; display: none; align-items: center; gap: 10px; }
  .client-badge.returning { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green-text); display: flex; }
  .client-badge.new { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-text); display: flex; }
  .badge-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .returning .badge-dot { background: var(--green-text); color: #fff; }
  .new .badge-dot { background: var(--blue-text); color: #fff; }

  /* FORM */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  input, select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; background: var(--bg); color: var(--text); width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; }
  .submit-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .submit-btn:hover { background: var(--accent-dark); }
  .submit-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; text-align: center; }
  .stat-n { font-size: 26px; font-weight: 700; color: var(--accent-dark); }
  .stat-l { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* BANNER OGGI */
  .today-banner { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 10px; padding: 9px 14px; margin-bottom: 1rem; font-size: 13px; color: var(--green-text); font-weight: 500; display: none; }

  /* SEARCH & FILTERS */
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap input { padding-left: 36px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  .filters { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn { padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; background: var(--card); cursor: pointer; color: var(--muted); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  /* LISTA */
  .res-list { display: flex; flex-direction: column; gap: 8px; }
  .res-card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 1rem 1.1rem; display: flex; align-items: flex-start; gap: 12px; }
  .date-block { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; text-align: center; min-width: 50px; flex-shrink: 0; }
  .date-day { font-size: 20px; font-weight: 700; line-height: 1; }
  .date-mon { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .res-info { flex: 1; min-width: 0; }
  .res-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .res-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .res-note { font-size: 12px; color: var(--muted); margin-top: 3px; font-style: italic; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .chip.returning { background: var(--green-bg); color: var(--green-text); }
  .chip.new { background: var(--blue-bg); color: var(--blue-text); }
  .res-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .time-chip { background: var(--bg); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 4px 6px; border-radius: 8px; line-height: 1; }
  .del-btn:hover { color: var(--red); background: #fdeaea; }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 14px; }
  .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }


  /* OGGI EVIDENZIATO */
  .res-card.oggi { border-left: 3px solid var(--accent); background: #fffdf7; }
  /* WHATSAPP BTN */
  .wa-btn { background: none; border: none; cursor: pointer; color: #25d366; font-size: 18px; padding: 4px 6px; border-radius: 8px; line-height: 1; }
  .wa-btn:hover { background: #e8fdf0; }
  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .modal { background: var(--card); border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 1rem; }
  .modal-actions { display: flex; gap: 8px; margin-top: 1rem; }
  .btn-cancel { flex: 1; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: none; font-size: 14px; cursor: pointer; color: var(--muted); }
  .btn-save { flex: 2; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-save:hover { background: var(--accent-dark); }
  /* BLACKLIST */
  .client-badge.blacklist { background: #fdeaea; border: 1px solid #f4a4a4; color: var(--red); display: flex; }
  .blacklist .badge-dot { background: var(--red); color: #fff; }
  .chip.blacklist { background: #fdeaea; color: var(--red); }
  .ban-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 4px 6px; border-radius: 8px; line-height: 1; }
  .ban-btn:hover { color: var(--red); background: #fdeaea; }
  .bl-card { background: var(--card); border: 1px solid #f4a4a4; border-radius: 13px; padding: 0.9rem 1.1rem; display: flex; align-items: center; gap: 12px; }
  .bl-info { flex: 1; }
  .bl-name { font-size: 15px; font-weight: 600; color: var(--red); }
  .bl-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .bl-motivo { font-size: 12px; background: #fdeaea; color: var(--red); border-radius: 6px; padding: 2px 8px; display: inline-block; margin-top: 4px; }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid.three { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-n { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><img src="logo.jpeg" style="width:80px;height:80px;border-radius:50%;object-fit:cover"></div>
    <div class="login-title">Prenotazioni</div>
    <div class="login-sub">Accedi per gestire il tuo ristorante</div>
    <input type="password" id="loginInput" placeholder="Password" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">Entra</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div>
      <div class="header-title"><img src="logo.jpeg" style="height:32px;vertical-align:middle;border-radius:50%;margin-right:8px">Prenotazioni</div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Esci</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('nuova')">+ Nuova</button>
    <button class="tab" onclick="showTab('elenco')">Elenco</button>
    <button class="tab" onclick="showTab('blacklist')" id="tabBlacklist">🚫 Blacklist</button>
  </div>

  <!-- TAB NUOVA -->
  <div id="tab-nuova">
    <div id="clienteBadge" class="client-badge">
      <div class="badge-dot" id="badgeDot"></div>
      <div id="badgeText"></div>
    </div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label>Nome cliente</label>
          <input type="text" id="nome" placeholder="es. Mario Rossi" oninput="checkCliente(this.value)" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Telefono</label>
          <input type="tel" id="telefono" placeholder="es. 333 1234567" oninput="checkCliente(document.getElementById('nome').value)">
        </div>
      </div>
      <div class="form-grid three">
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="data">
        </div>
        <div class="form-group">
          <label>Orario</label>
          <input type="time" id="orario" value="20:00">
        </div>
        <div class="form-group">
          <label>Coperti</label>
          <select id="coperti" onchange="toggleCopertiCustom(this)">
            <option>1</option><option>2</option><option selected>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option value="custom">Altro...</option>
          </select>
          <input type="number" id="copertiCustom" min="11" max="999" placeholder="Quanti coperti?" style="display:none;margin-top:6px">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group full">
          <label>Note (allergie, occasione, tavolo...)</label>
          <input type="text" id="note" placeholder="es. allergia noci, compleanno, tavolo finestra...">
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="addPrenotazione()">Aggiungi prenotazione</button>
    </div>
  </div>

  <!-- TAB ELENCO -->
  <div id="tab-elenco" style="display:none">
    <div class="stats-row">
      <div class="stat"><div class="stat-n" id="statTot">—</div><div class="stat-l">Totali</div></div>
      <div class="stat"><div class="stat-n" id="statOggi">—</div><div class="stat-l">Oggi</div></div>
      <div class="stat"><div class="stat-n" id="statHab">—</div><div class="stat-l">Abituali</div></div>
    </div>
    <button onclick="refreshLista()" id="refreshBtn" style="width:100%;margin-bottom:10px;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:13px;color:var(--muted);cursor:pointer;">🔄 Aggiorna prenotazioni</button>
    <div id="todayBanner" class="today-banner"></div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Cerca per nome o telefono..." oninput="renderLista(this.value)">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('tutti',this)">Tutte</button>
      <button class="filter-btn" onclick="setFilter('oggi',this)">Oggi</button>
      <button class="filter-btn" onclick="setFilter('futuri',this)">Prossime</button>
      <button class="filter-btn" onclick="setFilter('passati',this)">Passate</button>
    </div>
    <div id="lista" class="res-list"><div class="loading">Caricamento...</div></div>
  </div>
</div>

  <!-- TAB BLACKLIST -->
  <div id="tab-blacklist" style="display:none">
    <div style="margin-bottom:1rem;font-size:13px;color:var(--muted)">Clienti in blacklist — riconosciuti automaticamente per nome e telefono.</div>
    <div id="blLista" class="res-list"><div class="loading">Caricamento...</div></div>
  </div>


<!-- MODAL MODIFICA -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">✏️ Modifica prenotazione</div>
    <div class="form-grid">
      <div class="form-group"><label>Nome</label><input type="text" id="editNome"></div>
      <div class="form-group"><label>Telefono</label><input type="tel" id="editTelefono"></div>
    </div>
    <div class="form-grid three">
      <div class="form-group"><label>Data</label><input type="date" id="editData"></div>
      <div class="form-group"><label>Orario</label><input type="time" id="editOrario"></div>
      <div class="form-group"><label>Coperti</label><input type="number" id="editCoperti" min="1" max="999"></div>
    </div>
    <div class="form-grid">
      <div class="form-group full"><label>Note</label><input type="text" id="editNote"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-save" onclick="saveEdit()">Salva modifiche</button>
    </div>
  </div>
</div>
<!-- MODAL BLACKLIST -->
<div class="modal-overlay" id="modalBan" style="display:none" onclick="if(event.target===this)closeBan()">
  <div class="modal">
    <div class="modal-title">🚫 Aggiungi alla blacklist</div>
    <div class="form-group" style="margin-bottom:12px"><label>Nome</label><input type="text" id="banNome" readonly style="background:#f0f0f0"></div>
    <div class="form-group" style="margin-bottom:12px"><label>Telefono</label><input type="text" id="banTelefono" readonly style="background:#f0f0f0"></div>
    <div class="form-group" style="margin-bottom:12px"><label>Motivo</label><input type="text" id="banMotivo" placeholder="es. no-show, non pagato, comportamento..."></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBan()">Annulla</button>
      <button class="btn-save" style="background:var(--red)" onclick="saveBan()">Aggiungi blacklist</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── CONFIGURAZIONE ───────────────────────────────────────────────
const SUPABASE_URL = 'https://hlzaghdjqwxijogunans.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsemFnaGRqcXd4aWpvZ3VuYW5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMzg1MjYsImV4cCI6MjA4ODkxNDUyNn0.jy3EFJw7G50Z7NFETU3Z-NojJlcJePXMuVpBZieuz8U';
const APP_PASSWORD = '1210';
// ─────────────────────────────────────────────────────────────────

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let prenotazioni = [];
let currentFilter = 'tutti';
let currentSearch = '';
let editingId = null;
let refreshTimer = null;
let blacklist = [];
let banningId = null;
const todayStr = (()=>{ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); })();

document.getElementById('headerDate').textContent = new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('data').value = todayStr;

// LOGIN
function doLogin() {
  const v = document.getElementById('loginInput').value;
  if(v === APP_PASSWORD) {
    sessionStorage.setItem('auth','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    loadPrenotazioni();
    startAutoRefresh();
  } else {
    document.getElementById('loginError').textContent='Password errata';
    document.getElementById('loginInput').value='';
  }
}
function doLogout() {
  sessionStorage.removeItem('auth');
  if(refreshTimer) { clearInterval(refreshTimer); refreshTimer=null; }
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}
if(sessionStorage.getItem('auth')==='1') {
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  loadPrenotazioni();
  startAutoRefresh();
}

// TABS
function showTab(t) {
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['nuova','elenco','blacklist'][i]===t));
  document.getElementById('tab-nuova').style.display=t==='nuova'?'':'none';
  document.getElementById('tab-elenco').style.display=t==='elenco'?'':'none';
  document.getElementById('tab-blacklist').style.display=t==='blacklist'?'':'none';
  if(t==='elenco') renderLista();
  if(t==='blacklist') renderBlacklist();
}

// SUPABASE
async function loadPrenotazioni() {
  const [{ data: pren, error: e1 }, { data: bl, error: e2 }] = await Promise.all([
    sb.from('prenotazioni').select('*').order('data').order('orario'),
    sb.from('blacklist').select('*').order('data_aggiunta', {ascending:false})
  ]);
  if(e1){ showToast('Errore connessione database'); return; }
  prenotazioni = pren || [];
  blacklist = bl || [];
  renderLista();
  renderBlacklist();
}

async function addPrenotazione() {
  const nome = document.getElementById('nome').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const data = document.getElementById('data').value;
  const orario = document.getElementById('orario').value;
  const copertiSel = document.getElementById('coperti').value;
  const coperti = copertiSel === 'custom' ? document.getElementById('copertiCustom').value : copertiSel;
  if(copertiSel === 'custom' && !coperti){ showToast('Inserisci il numero di coperti'); return; }
  const note = document.getElementById('note').value.trim();
  if(!nome||!data||!orario){ showToast('Inserisci nome, data e orario'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Salvataggio...';

  const { data: inserted, error } = await sb.from('prenotazioni').insert([{nome,telefono,data,orario,coperti,note}]).select();
  btn.disabled=false; btn.textContent='Aggiungi prenotazione';

  if(error){ showToast('Errore nel salvataggio'); return; }
  prenotazioni.push(inserted[0]);
  showToast('Prenotazione aggiunta ✓');
  document.getElementById('nome').value='';
  document.getElementById('telefono').value='';
  document.getElementById('note').value='';
  document.getElementById('orario').value='20:00';
  document.getElementById('data').value=todayStr;
  document.getElementById('clienteBadge').style.display='none';
  await loadPrenotazioni();
  showTab('elenco');
}

async function deleteRes(id) {
  if(!confirm('Eliminare questa prenotazione?')) return;
  const { error } = await sb.from('prenotazioni').delete().eq('id',id);
  if(error){ showToast('Errore eliminazione'); return; }
  prenotazioni = prenotazioni.filter(p=>p.id!==id);
  renderLista();
  showToast('Prenotazione eliminata');
}

// CLIENTE ABITUALE
function normName(s){ return (s||'').toLowerCase().trim().replace(/\s+/g,' ').split(' ').sort().join(' '); }
function checkCliente(val) {
  const v = normName(val);
  const badge = document.getElementById('clienteBadge');
  if(v.length < 2){ badge.style.display='none'; return; }
  const telRaw = (document.getElementById('telefono').value||'').replace(/[^0-9]/g,'');
  const byName = prenotazioni.filter(p=>normName(p.nome)===v);
  const byTel = telRaw.length > 5 ? prenotazioni.filter(p=>(p.telefono||'').replace(/[^0-9]/g,'')===telRaw) : [];
  const ids = new Set();
  const storico = [...byName,...byTel].filter(p=>{ if(ids.has(p.id)) return false; ids.add(p.id); return true; });
  const banEntry = isInBlacklist(val, document.getElementById('telefono').value);
  if(banEntry) {
    badge.className='client-badge blacklist';
    document.getElementById('badgeDot').textContent='⛔';
    document.getElementById('badgeText').innerHTML='<strong>Cliente in BLACKLIST</strong> — '+banEntry.motivo;
    badge.style.display='flex';
    return;
  }
  if(storico.length>0) {
    badge.className='client-badge returning';
    const ultima = [...storico].sort((a,b)=>b.data.localeCompare(a.data))[0];
    const d = new Date(ultima.data+'T12:00:00');
    const altriNomi = [...new Set(storico.map(p=>p.nome))].filter(n=>normName(n)!==v);
    const extra = altriNomi.length>0 ? ' (anche come <em>'+altriNomi.join(', ')+'</em>)' : '';
    document.getElementById('badgeDot').textContent='✓';
    document.getElementById('badgeText').innerHTML='<strong>Cliente abituale</strong>'+extra+' — '+storico.length+' prenotazion'+(storico.length===1?'e':'i')+'. Ultima: '+d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
    badge.style.display='flex';
  } else {
    badge.className='client-badge new';
    document.getElementById('badgeDot').textContent='★';
    document.getElementById('badgeText').textContent='Nuovo cliente';
    badge.style.display='flex';
  }
}

// LISTA
function setFilter(f,btn) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLista(currentSearch);
}

function renderLista(search) {
  if(search!==undefined) currentSearch=search||'';
  // stats
  const tot=prenotazioni.length;
  const ogg=prenotazioni.filter(p=>p.data===todayStr).length;
  const nomi=[...new Set(prenotazioni.map(p=>normName(p.nome)))];
  const hab=nomi.filter(n=>prenotazioni.filter(p=>normName(p.nome)===n).length>1).length;
  document.getElementById('statTot').textContent=tot;
  document.getElementById('statOggi').textContent=ogg;
  document.getElementById('statHab').textContent=hab;
  const banner=document.getElementById('todayBanner');
  if(ogg>0){
    const cop=prenotazioni.filter(p=>p.data===todayStr).reduce((s,p)=>s+(parseInt(p.coperti)||0),0);
    banner.textContent=`Oggi: ${ogg} prenotazion${ogg===1?'e':'i'} — circa ${cop} copert${cop===1?'o':'i'}`;
    banner.style.display='block';
  } else banner.style.display='none';

  let res=[...prenotazioni];
  if(currentFilter==='oggi') res=res.filter(p=>p.data===todayStr);
  else if(currentFilter==='futuri') res=res.filter(p=>p.data>=todayStr);
  else if(currentFilter==='passati') res=res.filter(p=>p.data<todayStr);
  if(currentSearch){
    const q=normName(currentSearch);
    res=res.filter(p=>normName(p.nome).includes(q)||(p.telefono||'').includes(q));
  }
  if(currentFilter==='oggi') {
    res.sort((a,b)=>a.orario.localeCompare(b.orario));
  } else if(currentFilter==='futuri') {
    res.sort((a,b)=>{ const dc=a.data.localeCompare(b.data); return dc!==0?dc:a.orario.localeCompare(b.orario); });
  } else {
    res.sort((a,b)=>{ const dc=b.data.localeCompare(a.data); return dc!==0?dc:a.orario.localeCompare(b.orario); });
  }

  const lista=document.getElementById('lista');
  if(res.length===0){ lista.innerHTML='<div class="empty">Nessuna prenotazione trovata</div>'; return; }
  const mesi=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  lista.innerHTML=res.map(p=>{
    const d=new Date(p.data+'T12:00:00');
    const isAb=prenotazioni.filter(x=>normName(x.nome)===normName(p.nome)&&x.id!==p.id).length>0;
    const isOggi=p.data===todayStr;
    const isBan=isInBlacklist(p.nome,p.telefono);
    const giorniBrevi=['dom','lun','mar','mer','gio','ven','sab'];
    return `<div class="res-card${isOggi?' oggi':''}">
      <div class="date-block">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:1px">${giorniBrevi[d.getDay()]}</div>
        <div class="date-day">${d.getDate()}</div>
        <div class="date-mon">${mesi[d.getMonth()]}</div>
        ${d.getFullYear()!==new Date().getFullYear()?'<div style="font-size:9px;color:var(--muted)">'+d.getFullYear()+'</div>':''}
      </div>
      <div class="res-info">
        <div class="res-name">${p.nome} <span class="chip ${isAb?'returning':'new'}">${isAb?'Abituale':'Nuovo'}</span>${isBan?'<span class="chip blacklist">⛔ Blacklist</span>':''}</div>
        <div class="res-meta" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px"><span style="background:#FFF3E0;color:#E65100;font-weight:600;padding:2px 9px;border-radius:20px;font-size:12px">&#128101; ${p.coperti} copert${p.coperti==='1'?'o':'i'}</span>${p.telefono?'<span style="color:var(--muted);font-size:13px">'+p.telefono+'</span>':''}</div>${p.note?'<div style="background:#E8F5E9;color:#2E7D32;border-radius:6px;padding:3px 9px;margin-top:4px;font-size:12px">&#128221; '+p.note+'</div>':''}
      </div>
      <div class="res-right">
        <span class="time-chip">${(p.orario||'').substring(0,5)}</span>
        <div style="display:flex;gap:2px">
          <button class="wa-btn" onclick="openWhatsApp('${p.telefono||''}','${p.nome}','${p.data}','${p.orario}','${p.coperti}')" title="WhatsApp">💬</button>
          <button class="del-btn" onclick="openEdit(${p.id})" title="Modifica" style="color:var(--accent);font-size:14px">✏️</button>
          <button class="ban-btn" onclick="openBan(${p.id})" title="Blacklist">🚫</button>
          <button class="del-btn" onclick="deleteRes(${p.id})" title="Elimina">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}


function toggleCopertiCustom(sel) {
  const c = document.getElementById('copertiCustom');
  c.style.display = sel.value==='custom' ? 'block' : 'none';
  if(sel.value==='custom') c.focus();
}


// MODIFICA
function openEdit(id) {
  const p = prenotazioni.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  document.getElementById('editNome').value = p.nome||'';
  document.getElementById('editTelefono').value = p.telefono||'';
  document.getElementById('editData').value = p.data||'';
  document.getElementById('editOrario').value = p.orario||'';
  document.getElementById('editCoperti').value = p.coperti||'';
  document.getElementById('editNote').value = p.note||'';
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal() {
  document.getElementById('modalOverlay').style.display='none';
  editingId = null;
}
async function saveEdit() {
  if(!editingId) return;
  const updates = {
    nome: document.getElementById('editNome').value.trim(),
    telefono: document.getElementById('editTelefono').value.trim(),
    data: document.getElementById('editData').value,
    orario: document.getElementById('editOrario').value,
    coperti: document.getElementById('editCoperti').value,
    note: document.getElementById('editNote').value.trim(),
  };
  if(!updates.nome||!updates.data||!updates.orario){ showToast('Nome, data e orario obbligatori'); return; }
  const btn = document.querySelector('#modalOverlay .btn-save');
  btn.disabled=true; btn.textContent='Salvataggio...';
  const { error } = await sb.from('prenotazioni').update(updates).eq('id', editingId);
  btn.disabled=false; btn.textContent='Salva modifiche';
  if(error){ showToast('Errore nel salvataggio'); return; }
  const idx = prenotazioni.findIndex(x=>x.id===editingId);
  if(idx>=0) prenotazioni[idx] = {...prenotazioni[idx], ...updates};
  closeModal();
  renderLista();
  showToast('Prenotazione modificata ✓');
}
// WHATSAPP
function openWhatsApp(telefono, nome, data, orario, coperti) {
  const tel = (telefono||'').replace(/[^0-9+]/g,'');
  if(!tel){ showToast('Numero di telefono non presente'); return; }
  const d = new Date(data+'T12:00:00');
  const giorni = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
  const mesiLong = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const dataFmt = giorni[d.getDay()]+' '+d.getDate()+' '+mesiLong[d.getMonth()];
  const msg = encodeURIComponent('Buongiorno '+nome+', le confermiamo la prenotazione al ristorante Mi Ricriju per '+dataFmt+' alle '+orario.substring(0,5)+' per '+coperti+' pers'+(coperti==='1'?'ona':'one')+'. A presto!');
  window.open('https://wa.me/39'+tel+'?text='+msg, '_blank');
}
// BLACKLIST
function isInBlacklist(nome, telefono) {
  const n = normName(nome);
  const t = (telefono||'').replace(/[^0-9]/g,'');
  return blacklist.find(b =>
    normName(b.nome)===n || (t.length>5 && (b.telefono||'').replace(/[^0-9]/g,'')===t)
  ) || null;
}
function openBan(id) {
  const p = prenotazioni.find(x=>x.id===id);
  if(!p) return;
  banningId = id;
  document.getElementById('banNome').value = p.nome||'';
  document.getElementById('banTelefono').value = p.telefono||'';
  document.getElementById('banMotivo').value = '';
  document.getElementById('modalBan').style.display='flex';
}
function closeBan() {
  document.getElementById('modalBan').style.display='none';
  banningId = null;
}
async function saveBan() {
  const nome = document.getElementById('banNome').value;
  const telefono = document.getElementById('banTelefono').value;
  const motivo = document.getElementById('banMotivo').value.trim();
  if(!motivo){ showToast('Inserisci il motivo'); return; }
  const btn = document.querySelector('#modalBan .btn-save');
  btn.disabled=true; btn.textContent='Salvataggio...';
  const { data, error } = await sb.from('blacklist').insert([{nome,telefono,motivo}]).select();
  btn.disabled=false; btn.textContent='Aggiungi blacklist';
  if(error){ showToast('Errore nel salvataggio'); return; }
  blacklist.unshift(data[0]);
  closeBan();
  renderLista();
  showToast('Cliente aggiunto alla blacklist');
}
async function removeBan(id) {
  if(!confirm('Rimuovere dalla blacklist?')) return;
  const { error } = await sb.from('blacklist').delete().eq('id',id);
  if(error){ showToast('Errore eliminazione'); return; }
  blacklist = blacklist.filter(b=>b.id!==id);
  renderBlacklist();
  showToast('Cliente rimosso dalla blacklist');
}
function renderBlacklist() {
  const tabBtn = document.getElementById('tabBlacklist');
  if(tabBtn) tabBtn.textContent = blacklist.length>0 ? '🚫 Blacklist ('+blacklist.length+')' : '🚫 Blacklist';
  const lista = document.getElementById('blLista');
  if(blacklist.length===0){ lista.innerHTML='<div class="empty">Nessun cliente in blacklist</div>'; return; }
  lista.innerHTML = blacklist.map(b => {
    const d = new Date(b.data_aggiunta);
    const dataFmt = d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
    return '<div class="bl-card"><div style="font-size:22px">🚫</div><div class="bl-info"><div class="bl-name">'+b.nome+'</div><div class="bl-meta">'+(b.telefono||'Nessun telefono')+' · Aggiunto il '+dataFmt+'</div>'+(b.motivo?'<div class="bl-motivo">'+b.motivo+'</div>':'')+'</div><button class="del-btn" onclick="removeBan('+b.id+')" title="Rimuovi">✕</button></div>';
  }).join('');
}


function startAutoRefresh() {
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    const [{ data: pren }, { data: bl }] = await Promise.all([
      sb.from('prenotazioni').select('*').order('data').order('orario'),
      sb.from('blacklist').select('*').order('data_aggiunta', {ascending:false})
    ]);
    if(pren) prenotazioni = pren;
    if(bl) blacklist = bl;
    renderLista();
    renderBlacklist();
  }, 30000);
}
async function refreshLista() {
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '⏳ Aggiornamento...';
  btn.disabled = true;
  await loadPrenotazioni();
  btn.textContent = '🔄 Aggiorna prenotazioni';
  btn.disabled = false;
  showToast('Prenotazioni aggiornate ✓');
}
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
