name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPA_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -s -o /dev/null https://hlzaghdjqwxijogunans.supabase.co/rest/v1/prenotazioni?limit=1 -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY"
          echo "Ping completato"
